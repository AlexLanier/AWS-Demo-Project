image: maven:3.9-eclipse-temurin-21

stages: [build, test, analyze, gate]

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/

variables:
  MAVEN_CLI_OPTS: "-B -ntp"
  GIT_DEPTH: "0"   # Sonar recommends full history for MR analysis

# ---------- Build ----------
build:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS clean compile
  only:
    - branches
    - merge_requests

# ---------- Test (JUnit results visible in MR UI) ----------
test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit: "**/surefire-reports/*.xml"
  only:
    - branches
    - merge_requests

# ---------- SonarCloud analysis ----------
sonar:scan:
  stage: analyze
  script:
    - >
      mvn $MAVEN_CLI_OPTS verify
      org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.login=${SONAR_TOKEN}
      -Dsonar.organization=${SONAR_ORGANIZATION}
      -Dsonar.projectKey=${SONAR_PROJECT_KEY}
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  needs: ["test"]
  only:
    - master
    - merge_requests

# ---------- (Optional) Fail pipeline if Quality Gate fails ----------
quality_gate:
  stage: gate
  image: alpine:3.20
  needs: ["sonar:scan"]
  script: |
    apk add --no-cache curl jq
    echo "Waiting for SonarCloud Quality Gate..."
    for i in $(seq 1 30); do
      STATUS=$(curl -s -u ${SONAR_TOKEN}: \
        "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}" \
        | jq -r '.projectStatus.status')
      echo "Quality Gate: ${STATUS}"
      if [ "$STATUS" = "OK" ]; then exit 0; fi
      if [ "$STATUS" = "ERROR" ]; then exit 1; fi
      sleep 5
    done
    echo "Timed out waiting for Quality Gate"; exit 1
  only:
    - master
    - merge_requests
